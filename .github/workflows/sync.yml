name: Dispatch resume and blog deployments

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  resume:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch web deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -f ref=web \
            -f "inputs[content_sha]=${{ github.sha }}"

  blog:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch blog deployment
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          gh api --method POST \
            "repos/$REPOSITORY_OWNER/ensia96.github.io/actions/workflows/deploy.yml/dispatches" \
            -f ref=main
